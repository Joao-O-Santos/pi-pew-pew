image: node:22-bookworm-slim

stages:
  - validate
  - pages
  - publish

validate:
  stage: validate
  interruptible: true
  coverage: '/all files\s+\|\s+([\d.]+)\s+\|/'
  script:
    - npm ci
    - node scripts/install-latest-pandoc.mjs
    - npm run check
    - npm run test:coverage
    - npm pack --dry-run

publish:
  stage: publish
  image: node:24-bookworm-slim
  needs: [validate]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm ci
    - npm run typecheck
    - npm test
    - npm publish

pages:
  stage: pages
  image: node:22-bookworm-slim
  needs: [validate]
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
  script:
    - npm ci
    - node scripts/install-latest-pandoc.mjs
    - mkdir -p public
    - printf '%s\n' '<!doctype html>' '<html lang="en">' '<head>' '<meta charset="utf-8">' '<meta name="viewport" content="width=device-width, initial-scale=1">' '<title>pi-pew-pew</title>' '<link rel="stylesheet" href="pages.css">' '</head>' '<body>' '<main>' > public/index.html
    - pandoc --from gfm --to html README.md >> public/index.html
    - printf '%s\n' '</main>' '</body>' '</html>' >> public/index.html
    - cp logo.png pages.css public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
